<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMD Driver - Ứng Dụng Đối Tác Tài Xế</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#4ade80', // Xanh lá nhạt
                            DEFAULT: '#16a34a', // Xanh lá LMD
                            dark: '#15803d', // Xanh đậm
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Tùy chỉnh thanh cuộn cho khu vực log */
        #logArea::-webkit-scrollbar { width: 6px; }
        #logArea::-webkit-scrollbar-track { bg-gray-100; rounded: 10px; }
        #logArea::-webkit-scrollbar-thumb { bg-gray-300; rounded: 10px; }
    </style>
</head>
<body class="font-sans antialiased text-gray-800 bg-gray-50">

    <header class="fixed w-full bg-white shadow-sm z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center cursor-pointer">
                    <div class="w-8 h-8 bg-brand text-white rounded flex items-center justify-center font-bold text-lg mr-2">
                        LMD
                    </div>
                    <span class="font-bold text-xl tracking-tight text-gray-900">LMD Driver</span>
                </div>
                <div class="flex items-center space-x-3 text-sm">
                    <span class="text-gray-600">Xin chào, Tài xế!</span>
                    <i class="fas fa-user-circle text-gray-400 text-2xl"></i>
                    <button class="text-gray-500 hover:text-red-500 transition"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </header>

    <main class="pt-20 pb-10 px-4">
        <div class="max-w-4xl mx-auto space-y-6">

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cấp Quyền (Dán Token đối tác):</label>
                        <div class="relative">
                            <i class="fas fa-key absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="tokenInput" placeholder="eyJhbGciOiJIUzI1NiIs..." class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-brand-light">
                        </div>
                    </div>
                    <div>
                        <button id="connectBtn" onclick="connectToHub()" class="w-full md:w-auto bg-brand hover:bg-brand-dark text-white px-6 py-2.5 rounded-lg font-bold flex items-center justify-center transition shadow-md shadow-green-100">
                            <i class="fas fa-power-off mr-2"></i> Bật Online
                        </button>
                    </div>
                </div>
                <div id="connectionStatusLine" class="h-1 bg-gray-200 mt-4 rounded-full transition-all duration-500"></div>
            </div>

            <div id="currentRideCard" class="hidden bg-white p-6 rounded-2xl shadow-lg border-2 border-brand-light relative overflow-hidden">
                <div class="absolute -right-10 -top-10 text-brand-light opacity-10 text-9xl">
                    <i class="fas fa-running"></i>
                </div>
                <div class="relative z-10 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-xl text-gray-900"><i class="fas fa-map-marked-alt text-brand mr-2"></i> Chuyến Đi Đang Thực Hiện</h3>
                        <span class="text-xs px-3 py-1 bg-green-100 text-brand rounded-full font-semibold">Accepted</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-gray-700 bg-gray-50 p-4 rounded-xl border border-gray-100">
                        <div><strong class="text-gray-900">📍 Điểm đón:</strong> <span id="crPickup"></span></div>
                        <div><strong class="text-gray-900">🏁 Điểm đến:</strong> <span id="crDest"></span></div>
                        <div><strong class="text-gray-900">📏 Khoảng cách:</strong> <span id="crDistance"></span> km</div>
                        <div><strong class="text-gray-900">💰 Phí dịch vụ:</strong> <span id="crPrice" class="font-bold text-brand"></span> VNĐ</div>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <div class="flex-1 bg-gray-100 p-3 rounded-lg flex items-center text-sm font-mono text-gray-600">
                            <i class="fas fa-satellite text-yellow-500 mr-2"></i> GPS (Giả lập): <span id="crGPS" class="ml-2">Đang chờ...</span>
                        </div>
                        <button onclick="completeRide()" class="bg-gray-900 hover:bg-gray-800 text-white font-bold py-3 px-6 rounded-lg transition">
                            🏁 Đã Chở Đến Nơi (Hoàn Thành)
                        </button>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-lg text-gray-900"><i class="fas fa-concierge-bell text-brand mr-2"></i> Sảnh Chờ Cuốc Xe</h3>
                    <span class="text-xs text-gray-500">Tự động cập nhật...</span>
                </div>
                <div id="logArea" class="space-y-4 min-h-[150px] max-h-[400px] overflow-y-auto pr-2">
                    <div class="text-center py-10 text-gray-400 bg-white rounded-xl shadow-sm border border-gray-100">
                        <i class="fas fa-mug-hot text-5xl mb-3"></i>
                        <p>Đang Online. Chờ khách đặt xe...</p>
                    </div>
                </div>
            </div>

            <details class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <summary class="p-4 cursor-pointer font-medium text-sm text-gray-600 bg-gray-50 select-none">
                    <i class="fas fa-terminal mr-2"></i> Nhật ký hoạt động hệ thống
                </summary>
                <div id="systemLog" class="p-4 text-xs font-mono text-gray-500 h-32 overflow-y-auto space-y-1">
                    <div>[Hệ thống] Sẵn sàng kết nối...</div>
                </div>
            </details>

        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

    <script>
        const API_URL = "http://localhost:5173/api";
        const HUB_URL = "http://localhost:5173/hubs/ride";
        let connection = null;
        let gpsInterval = null;
        let currentAcceptedRideId = null;

        // Ghi log hệ thống (góc terminal)
        function logSystem(msg) {
            const logBox = document.getElementById('systemLog');
            logBox.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function connectToHub() {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) { alert("Vui lòng nhập Token đối tác!"); return; }

            connection = new signalR.HubConnectionBuilder()
                .withUrl(HUB_URL, { accessTokenFactory: () => token })
                .withAutomaticReconnect().build();

            // Lắng nghe cuốc mới (Tạo Card)
            connection.on("ReceiveNewRideRequest", (ride) => {
                const sảnh_chờ = document.getElementById('logArea');
                
                // Xóa placeholder "Đang chờ" nếu là cuốc đầu tiên
                if (sảnh_chờ.querySelector('.text-gray-400')) { sảnh_chờ.innerHTML = ''; }

                const rideCardHtml = `
                    <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 flex flex-col sm:flex-row justify-between items-start gap-4 transition hover:border-brand-light" id="ride-${ride.id}">
                        <div class="space-y-1.5 flex-1">
                            <p class="text-xs font-mono text-gray-400">#${ride.id.substring(0,8)}</p>
                            <div class="text-sm">📍 Điểm đón: <strong class="text-gray-900">${ride.pickupLocation}</strong></div>
                            <div class="text-sm">🏁 Điểm đến: <strong class="text-gray-900">${ride.destination}</strong></div>
                            <div class="flex items-center gap-3 text-sm mt-3 pt-3 border-t border-gray-100">
                                <span><i class="fas fa-arrows-alt-h text-gray-400"></i> ${ride.distance} km</span>
                                <span class="text-lg font-bold text-brand">${ride.price.toLocaleString('vi-VN')} VNĐ</span>
                            </div>
                        </div>
                        <button onclick="acceptRide('${ride.id}', '${ride.pickupLocation}', '${ride.destination}', ${ride.distance}, ${ride.price})" class="w-full sm:w-auto bg-brand hover:bg-brand-dark text-white font-bold py-3 px-6 rounded-xl transition text-sm flex items-center justify-center">
                            <i class="fas fa-hand-holding-dollar mr-2"></i> NHẬN CUỐC
                        </button>
                    </div>
                `;
                sảnh_chờ.insertAdjacentHTML('afterbegin', rideCardHtml);
                logSystem(`🔥 Cuốc mới từ Hub: #${ride.id.substring(0,8)}`);
            });

            // Lắng nghe trạng thái (Chỉ dùng log)
            connection.on("RideStatusUpdated", (status) => {
                logSystem(`🔔 Trạng thái chuyến xe: [${status}]`);
            });

            try {
                await connection.start();
                logSystem("✅ Kết nối SignalR THÀNH CÔNG!");
                
                // Cập nhật giao diện Online
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('connectBtn').innerText = "Đang Online";
                document.getElementById('connectBtn').className = "w-full md:w-auto bg-gray-200 text-gray-500 px-6 py-2.5 rounded-lg font-bold flex items-center justify-center cursor-not-allowed";
                document.getElementById('connectionStatusLine').className = "h-1 bg-brand mt-4 rounded-full transition-all duration-500 shadow-sm shadow-green-200";
            } catch (err) {
                logSystem("❌ Lỗi kết nối Hub: " + err.toString());
                document.getElementById('connectionStatusLine').className = "h-1 bg-red-500 mt-4 rounded-full transition-all duration-500";
            }
        }

        // 1. Nhận Chuyến (Gọi API + Hiện Panel Theo Dõi)
        async function acceptRide(rideId, pickup, dest, distance, price) {
            const token = document.getElementById('tokenInput').value.trim();
            logSystem(`🛄 Đang gửi yêu cầu nhận chuyến #${rideId.substring(0,8)}...`);

            try {
                const response = await fetch(`${API_URL}/Driver/accept-ride/${rideId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    logSystem(`✅ Chấp nhận chuyến thành công!`);
                    
                    // 1. Xóa cuốc khỏi sảnh chờ
                    document.getElementById(`ride-${rideId}`).remove();
                    if (document.getElementById('logArea').innerHTML.trim() === '') {
                        document.getElementById('logArea').innerHTML = `
                            <div class="text-center py-10 text-gray-400 bg-white rounded-xl shadow-sm border border-gray-100">
                                <i class="fas fa-mug-hot text-5xl mb-3"></i>
                                <p>Tạm hết cuốc xe. Đang chờ thêm...</p>
                            </div>
                        `;
                    }

                    // 2. Hiện Card chuyến đi đang thực hiện
                    currentAcceptedRideId = rideId;
                    document.getElementById('currentRideCard').classList.remove('hidden');
                    document.getElementById('crPickup').innerText = pickup;
                    document.getElementById('crDest').innerText = dest;
                    document.getElementById('crDistance').innerText = distance;
                    document.getElementById('crPrice').innerText = price.toLocaleString('vi-VN');
                    
                    // 3. Bật GPS
                    startTracking(rideId); 

                } else { alert("Lỗi: " + await response.text()); }
            } catch (error) { console.error(error); }
        }

        // 2. Giả lập GPS Tracking
        function startTracking(rideId) {
            clearInterval(gpsInterval);
            let lat = 10.762622;
            let lng = 106.660172;
            logSystem("🚗 Bắt đầu gửi tọa độ GPS về Server...");

            gpsInterval = setInterval(async () => {
                lat += 0.0001; lng += 0.0001;
                try {
                    await connection.invoke("UpdateLocation", rideId, lat, lng);
                    // Cập nhật tọa độ lên Card
                    document.getElementById('crGPS').innerHTML = `(${lat.toFixed(5)}, ${lng.toFixed(5)})`;
                } catch (err) { }
            }, 3000); 
        }

        // 3. Hoàn Thành Chuyến (Gọi API + Ẩn Panel)
        async function completeRide() {
            if(!currentAcceptedRideId) return;
            const token = document.getElementById('tokenInput').value.trim();
            logSystem(`🏁 Đang gửi yêu cầu hoàn thành chuyến #${currentAcceptedRideId.substring(0,8)}...`);

            try {
                const response = await fetch(`${API_URL}/Driver/complete-ride/${currentAcceptedRideId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    logSystem(`✅ Hoàn thành chuyến thành công!`);
                    
                    // 1. Tắt GPS, ẩn Card
                    clearInterval(gpsInterval);
                    document.getElementById('currentRideCard').classList.add('hidden');
                    document.getElementById('crGPS').innerHTML = `Đang chờ...`;
                    currentAcceptedRideId = null;

                } else { alert("Lỗi: " + await response.text()); }
            } catch (error) { console.error(error); }
        }
    </script>
</body>
</html>
